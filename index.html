    <script>
      (function() {
        window.addEventListener('error', function(e) {
          if ((e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
              (e.message && typeof e.message === 'string' && e.message.indexOf('chrome: call method') !== -1)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var msg = typeof reason === 'string' ? reason : (reason && reason.message) || '';
          var stack = (reason && reason.stack) || '';
          if (msg.indexOf('chrome: call method') !== -1 || stack.indexOf('chrome-extension://') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
